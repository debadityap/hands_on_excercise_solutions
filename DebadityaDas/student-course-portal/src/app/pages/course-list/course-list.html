<div style="padding: 20px; font-family: Arial, sans-serif;">
    <h3>Available Academic Courses Track Options</h3>

    <!-- Step 96: Bind streams with async piping -->
    @if (isLoading$ | async) {
    <p style="font-weight: bold; color: #666;">Loading store data state...</p>
    } @else {
    <div style="display: flex; flex-wrap: wrap; margin-bottom: 25px;">
        <!-- Step 96 Hint: Render using the async pipe -->
        @for (c of (courses$ | async); track c.id) {
        <app-course-card [course]="c" (enrollRequested)="onEnroll($event)">
        </app-course-card>
        }
    </div>
    }
</div>
