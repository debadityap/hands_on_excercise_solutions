<div style="padding: 25px; font-family: Arial, sans-serif; max-width: 450px; margin: 0 auto; text-align: left;">
    <h2>Student Course Enrollment Request</h2>

    <!-- Step 46: Display confirmation success panel conditionally tracking submit configurations -->
    <div *ngIf="isSubmitted"
        style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
        Enrollment request submitted successfully!
    </div>

    <!-- Step 39: Form container wrapping submission mapping pipelines pipeline -->
    <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" novalidate>

        <!-- Student Name Field (Step 39, 43, 44) -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Student Name:</label>
            <input type="text" name="studentName" [(ngModel)]="formData.studentName" #nameCtrl="ngModel" required
                minlength="3"
                style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />

            <!-- Validation messages window parameters container blocks indicators -->
            <div *ngIf="nameCtrl.touched && nameCtrl.errors" style="color: red; font-size: 0.85em; margin-top: 5px;">
                <span *ngIf="nameCtrl.errors['required']">Name is required.</span>
                <span *ngIf="nameCtrl.errors['minlength']">Name must be at least 3 characters long.</span>
            </div>
        </div>

        <!-- Student Email Field (Step 39, 43) -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Email Address:</label>
            <input type="email" name="studentEmail" [(ngModel)]="formData.studentEmail" #emailCtrl="ngModel" required
                email
                style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />

            <div *ngIf="emailCtrl.touched && emailCtrl.errors" style="color: red; font-size: 0.85em; margin-top: 5px;">
                <span *ngIf="emailCtrl.errors['required']">Email is required.</span>
                <span *ngIf="emailCtrl.errors['email']">Please enter a valid email address.</span>
            </div>
        </div>

        <!-- Course ID Field (Step 39, 43) -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Course ID Number:</label>
            <input type="number" name="courseId" [(ngModel)]="formData.courseId" #courseCtrl="ngModel" required
                style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />

            <div *ngIf="courseCtrl.touched && courseCtrl.errors"
                style="color: red; font-size: 0.85em; margin-top: 5px;">
                <span *ngIf="courseCtrl.errors['required']">Course ID is required.</span>
            </div>
        </div>

        <!-- Preferred Semester Selector (Step 39) -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Preferred Semester:</label>
            <select name="preferredSemester" [(ngModel)]="formData.preferredSemester"
                style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                <option value="">-- Select Semester --</option>
                <option value="Odd">Odd</option>
                <option value="Even">Even</option>
            </select>
        </div>

        <!-- Terms and Conditions Checkbox Toggle (Step 39, 43) -->
        <div style="margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9em; cursor: pointer;">
                <input type="checkbox" name="agreeToTerms" [(ngModel)]="formData.agreeToTerms" #termsCtrl="ngModel"
                    required />
                I agree to the portal terms and guidelines statement.
            </label>

            <div *ngIf="termsCtrl.touched && termsCtrl.errors" style="color: red; font-size: 0.85em; margin-top: 5px;">
                <span *ngIf="termsCtrl.errors['required']">You must accept the terms to continue.</span>
            </div>
        </div>

        <!-- Interactive Controller Buttons (Step 41, 47) -->
        <div style="display: flex; gap: 10px;">
            <!-- Submit Button triggers conditional disabled locking parameters check blocks -->
            <button type="submit" [disabled]="enrollForm.invalid"
                style="background-color: #0275d8; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; transition: opacity 0.2s;">
                Submit Request
            </button>

            <!-- Reset Button resets target tracking context values layout forms states instances strings pipelines -->
            <button type="button" (click)="enrollForm.resetForm(); isSubmitted = false;"
                style="background-color: #f0ad4e; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Reset Form
            </button>
        </div>

    </form>
</div>
