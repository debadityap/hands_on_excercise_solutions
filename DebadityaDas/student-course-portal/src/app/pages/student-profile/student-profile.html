<div style="padding: 20px; font-family: Arial, sans-serif;">
    <h2>Student Dashboard Profile</h2>
    <hr style="border: 0; border-top: 1px solid #ccc; margin-bottom: 20px;">

    <div style="background-color: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 6px;">
        <h3>🎯 Active Course Enrollments</h3>

        <!-- Render this message if the global enrollment service array tracking is empty -->
        @if (enrolledCourses.length === 0) {
        <p style="color: #666; font-style: italic;">You haven't registered or enrolled in any courses yet.</p>
        } @else {
        <!-- Loop and show the current selected options -->
        <div style="display: grid; gap: 10px; margin-top: 15px;">
            @for (course of enrolledCourses; track course.id) {
            <div
                style="background: white; border: 1px solid #e0e0e0; padding: 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong style="color: #0066cc;">{{ course.code }}</strong> - {{ course.name }}
                    <span style="color: #666; margin-left: 10px;">({{ course.credits }} Credits)</span>
                </div>
                <button (click)="dropCourse(course.id)"
                    style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
                    Drop Course
                </button>
            </div>
            }
        </div>
        }
    </div>
</div>
